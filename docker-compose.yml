services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tiips-api
    restart: always
    command: sh -c "pnpm --filter @tiips/db push && pnpm --filter @tiips/api dev"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@dev_postgres:5432/${POSTGRES_DB:-tiips_db}?schema=public
      REDIS_URL: redis://dev_redis:6379
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3002:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
    networks:
      - dev-infra_default

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: tiips-web
    restart: always
    command: sh -c "pnpm --filter @tiips/db generate && pnpm --filter @tiips/web dev"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@dev_postgres:5432/${POSTGRES_DB:-tiips_db}?schema=public
      REDIS_URL: redis://dev_redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/apps/web/.next
      - uploads:/app/apps/web/public/insurers/logos
    networks:
      - dev-infra_default

  # nginx:
  #   image: nginx:alpine
  #   container_name: tiips-nginx
  #   restart: always
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./nginx/iipt.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - web
  #     - api
  #   networks:
  #     - dev-infra_default

volumes:
  uploads:

networks:
  dev-infra_default:
    external: true
    name: dev-infra_default
